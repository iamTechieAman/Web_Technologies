[build]
  command = "npm run build"
  publish = ".next"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_..."
  # Terminal Server URL (replace with your production PTY server)
  NEXT_PUBLIC_WS_SERVER_URL = "wss://codevisualizer-terminal.up.railway.app"
